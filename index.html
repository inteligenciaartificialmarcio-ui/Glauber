<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://i.imgur.com/sKycKNZ.png" />
    <title>Fala, Glauber! - Podcast e Livro Oficial</title>
    <meta name="description" content="Conheça o livro oficial do Podcast Fala Glauber. Garanta seu exemplar em pré-venda exclusiva e conheça a história por trás de um dos maiores podcasts do Brasil." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- Preload Hero Image -->
    <link rel="preload" as="image" href="https://i.imgur.com/f3OjCUD.png">
    
    <!-- Meta Tags para Redes Sociais -->
    <meta property="og:title" content="Fala, Glauber! - Podcast e Livro Oficial" />
    <meta property="og:description" content="Garanta seu exemplar em pré-venda exclusiva do livro do Podcast Fala Glauber." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suprimir mensagens de erro de WebSocket do Vite que sao normais neste ambiente de desenvolvimento
      window.addEventListener('unhandledrejection', (event) => {
        if (typeof event.reason === 'string' && event.reason.includes('WebSocket closed')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
